[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cossdf"
version = "1.0.6"
description = "Colab-first reproducible pipeline for CoSS-DF material/texture classification"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "scikit-image>=0.22",
  "Pillow>=10",
  "PyYAML>=6",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "gdown>=5.1",
  "psutil>=5.9",
]

[project.scripts]
cossdf = "cossdf.cli:main"

[tool.setuptools.packages.find]
include = ["cossdf*"]
